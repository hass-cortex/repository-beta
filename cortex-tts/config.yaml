name: Cortex TTS
description: "On-device text-to-speech for Home Assistant \u2014 a choice of models\
  \ running locally, built-in voices or one cloned from a short recording, plus the\
  \ Chinese text pipeline they all lack"
version: 0.7.0
slug: cortex_tts
url: https://github.com/hass-cortex/app-cortex-tts
arch:
- amd64
startup: services
init: false
homeassistant: 2026.3.0
timeout: 300
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8771
panel_icon: mdi:account-voice
panel_title: Cortex TTS
discovery:
- cortex_tts
ports:
  8771/tcp: null
ports_description:
  8771/tcp: TTS HTTP API and Admin UI (optional; bearer key required)
ingress_stream: true
map:
- type: share
  read_only: false
options:
  log_level: info
  discovery_api_key: ''
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  discovery_api_key: password?
image: ghcr.io/hass-cortex/cortex_tts/{arch}
